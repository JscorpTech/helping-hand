networks:
  helping_hand:
    driver: bridge

volumes:
  pg_data: null
  pycache: null

services:
  nginx:
    networks:
      - helping_hand
    ports:
      - ${PORT:-8001}:80
    volumes:
      - ./resources/layout/nginx.conf:/etc/nginx/nginx.conf
      - ./resources/:/usr/share/nginx/html/resources/
    build:
      context: .
      dockerfile: ./docker/Dockerfile.nginx
    depends_on:
      - helping-web
  helping-web:
    env_file:
      - .env
    networks:
      - helping_hand
    build:
      context: .
      dockerfile: ./docker/Dockerfile.web
    restart: always
    environment:
      - PYTHONPYCACHEPREFIX=/var/cache/pycache
      - SCRIPT=${SCRIPT:-entrypoint.sh}
    volumes:
      - './:/code'
      - pycache:/var/cache/pycache
    depends_on:
      - db
      - redis
  db:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.postgres
    networks:
      - helping_hand
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-django}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-2309}
    volumes:
      - pg_data:/var/lib/postgresql/data
  celery:
    env_file:
      - .env
    networks:
      - helping_hand
    build:
      context: .
      dockerfile: ./docker/Dockerfile.web
    restart: always
    environment:
      - PYTHONPYCACHEPREFIX=/var/cache/pycache
      - SCRIPT=celery.sh
    volumes:
      - './:/code'
      - pycache:/var/cache/pycache
    depends_on:
      - db
      - redis
  redis:
    networks:
      - helping_hand
    restart: always
    image: redis
